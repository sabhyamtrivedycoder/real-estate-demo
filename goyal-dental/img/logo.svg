<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cb76" />
      <stop offset="35%" stop-color="#c59b27" />
      <stop offset="70%" stop-color="#9a7413" />
      <stop offset="100%" stop-color="#694d04" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfaf0" />
      <stop offset="100%" stop-color="#f5ecdb" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c59b27" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Gold Border -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="#c59b27" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Inner Soft Golden Medical Surface -->
  <circle cx="120" cy="120" r="102" fill="url(#goldLight)" />

  <!-- Central Stylized Tooth Emblem -->
  <!-- Clean Anatomical Bicuspid Crown Contour -->
  <g transform="translate(120, 105)" filter="url(#softGlow)">
    <!-- Tooth Body -->
    <path d="M 0 -45 
             C 18 -45 36 -32 38 -12 
             C 40 8 36 28 26 48 
             C 22 56 16 58 12 42 
             C 8 26 5 18 0 18 
             C -5 18 -8 26 -12 42 
             C -16 58 -22 56 -26 48 
             C -36 28 -40 8 -38 -12 
             C -36 -32 -18 -45 0 -45 Z" 
          fill="#ffffff" stroke="url(#goldLinear)" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Reflection Highlight -->
    <path d="M -18 -32 
             C -8 -38 0 -38 0 -38
             C 0 -38 -8 -15 -14 5" 
          fill="none" stroke="#e8cb76" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Orthodontic Archwire Curve (Symbolizing Orthodontics & Alignment) -->
    <path d="M -50 -2 Q 0 16 50 -2" fill="none" stroke="url(#goldLinear)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Orthodontic Brackets (Precision Alignment Nodes) -->
    <!-- Center Bracket -->
    <rect x="-6" y="2" width="12" height="12" rx="2.5" fill="url(#goldLinear)" />
    <line x1="-3" y1="8" x2="3" y2="8" stroke="#ffffff" stroke-width="1.5" />

    <!-- Left Bracket -->
    <rect x="-28" y="-6" width="10" height="10" rx="2" fill="url(#goldLinear)" />
    <line x1="-26" y1="-1" x2="-20" y2="-1" stroke="#ffffff" stroke-width="1.2" />

    <!-- Right Bracket -->
    <rect x="18" y="-6" width="10" height="10" rx="2" fill="url(#goldLinear)" />
    <line x1="20" y1="-1" x2="26" y2="-1" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- Radiance Sparkle (Smile Aesthetic) -->
  <polygon points="154,65 156,73 164,75 156,77 154,85 152,77 144,75 152,73" fill="url(#goldLinear)" />
  <polygon points="86,68 87,74 93,75 87,76 86,82 85,76 79,75 85,74" fill="url(#goldLinear)" opacity="0.85" />

  <!-- Typography Arc: GOYAL ORTHODONTIC -->
  <!-- Top Curved Path -->
  <path id="topTextPath" d="M 38 120 A 82 82 0 0 1 202 120" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#292524" letter-spacing="3.2">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      GOYAL ORTHODONTIC
    </textPath>
  </text>

  <!-- Bottom Curved Path: DENTAL CARE &bull; GURUGRAM -->
  <path id="bottomTextPath" d="M 202 120 A 82 82 0 0 1 38 120" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#785908" letter-spacing="2.4">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      DENTAL CARE &bull; SECTOR 15
    </textPath>
  </text>

  <!-- Side Star Anchors -->
  <circle cx="36" cy="120" r="2.5" fill="url(#goldLinear)" />
  <circle cx="204" cy="120" r="2.5" fill="url(#goldLinear)" />
</svg>
